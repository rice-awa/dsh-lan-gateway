allowBuilds:
  esbuild: true

# The @deepseek-ai/* packages are provided by the running harness, not resolved
# from the registry: every one of them declares a peer set pinned to its own
# release line (dsh-client-runtime 0.1.1-rc.2 peers on dsh-llm ^0.1.1-rc.2 while
# the host ships 0.1.5-rc.2), and prerelease ranges cannot span those lines —
# so auto-installing them fails on the first `^0.1.5` with no matching release.
# The same setting is what the dsh profile itself uses. Our own devDependencies
# name the exact versions we compile and typecheck against.
autoInstallPeers: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/dsh-agent@0.2.1-rc.1'
  - '@deepseek-ai/dsh-atomic-write@0.2.1-rc.1'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-rc.1'
  - '@deepseek-ai/dsh-config-editor@0.2.1-rc.1'
  - '@deepseek-ai/dsh-cordis-client-runner@0.2.1-rc.1'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.1'
  - '@deepseek-ai/dsh-ptc-runtime@0.2.1-rc.1'
  - '@deepseek-ai/dsh-sandbox-policy@0.2.1-rc.1'
  - '@deepseek-ai/dsh-sandbox@0.2.1-rc.1'
  - '@deepseek-ai/dsh-scope@0.2.1-rc.1'
  - '@deepseek-ai/dsh-session@0.2.1-rc.1'
  - '@deepseek-ai/dsh-settings@0.2.1-rc.1'
  - '@deepseek-ai/dsh-system-prompt@0.2.1-rc.1'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.1'
  - '@deepseek-ai/dsh-tools@0.2.1-rc.1'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.1'
  - '@deepseek-ai/dsh-user-approval@0.2.1-rc.1'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-rc.1'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.1'
  - '@deepseek-ai/schemastery@3.18.5'
